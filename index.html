<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Grade Verification</title>
	
	<!-- Bootstrap 5 CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

	<link rel="stylesheet" type="text/css" href="style.css">


</head>
<body>

<div class="container">
	<h1 class="text-center">Grade Verification</h1>
	<hr>
	<form>
		<label for="inputGrade" class="form-label">Enter your grade:</label>
		<input type="number" id="inputGrade" class="form-control" placeholder="e.g., 65">
		<button type="button" class="btn btn-primary mt-3" onclick="verifyGrade()">Verify</button>
		<button type="button" class="btn btn-primary mt-3" onClick="window.location.reload()">
      	Refresh </button>
	</form>
</div>

<script src="main.js"></script>


</body>
</html>
